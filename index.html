<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXO HUB | Key System</title>

    <meta property="og:title" content="EXO HUB | Universal Access" />
    <meta property="og:description" content="Ultimate script hub and premium features. Get your access key now." />
    <meta property="og:url" content="https://exo-hub.github.io/EXO-HUB-KEY-SYSTEM-FIX/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/ajhayigop4/EXO-HUB-KEY-SYSTEM-FIX/main/preview.png" />
    <meta name="theme-color" content="#bc13fe">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 360px;
            text-align: center;
        }

        .system-status {
            font-size: 10px;
            letter-spacing: 4px;
            color: #444;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .brand-container {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-name {
            font-size: 45px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .purple {
            color: #bc13fe;
            text-shadow: 0 0 20px rgba(188, 19, 254, 0.7);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #bc13fe;
            margin-left: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .sub-text {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .key-section {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .key-display {
            font-family: 'Courier New', monospace;
            font-size: 22px;
            color: #ffffff;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #333;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .copy-btn {
            background: #bc13fe;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .copy-btn:hover { background: #d450ff; }

        .live-sync {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #00ff88;
        }

        .dot {
            height: 7px;
            width: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="system-status">System Active</div>
        
        <div class="brand-container">
            <h1 class="brand-name">
                <span id="typed-text"></span><span class="cursor">&nbsp;</span>
            </h1>
        </div>
        
        <div class="sub-text">Premium script access for EXO community.</div>

        <div class="key-section">
            <div class="key-display" id="key-text">••••••••••</div>
            <button class="copy-btn" onclick="handleCopy()">Copy Key</button>
        </div>

        <div class="live-sync">
            <div class="dot"></div>
            LIVE SYNC READY
        </div>
    </div>

    <script>
        // PERMANENT KEY
        const FIXED_KEY = "EXO-ON-TOP";

        // TYPEWRITER ANIMATION (LOOP)
        const textElement = document.getElementById('typed-text');
        const fullText = "EXO HUB";
        let index = 0;
        let isDeleting = false;

        function typeLoop() {
            const currentText = fullText.substring(0, index);
            let formattedText = "";
            for (let i = 0; i < currentText.length; i++) {
                if (i >= 4) {
                    formattedText += `<span class="purple">${fullText[i]}</span>`;
                } else {
                    formattedText += fullText[i];
                }
            }
            textElement.innerHTML = formattedText;

            let typeSpeed = isDeleting ? 100 : 200;

            if (!isDeleting && index < fullText.length) {
                index++;
            } else if (isDeleting && index > 0) {
                index--;
            } else if (!isDeleting && index === fullText.length) {
                typeSpeed = 2000; 
                isDeleting = true;
            } else if (isDeleting && index === 0) {
                isDeleting = false;
                typeSpeed = 500;
            }
            setTimeout(typeLoop, typeSpeed);
        }

        // COPY FUNCTION
        function handleCopy() {
            const display = document.getElementById('key-text');
            display.innerText = FIXED_KEY;
            display.style.color = "#bc13fe";
            
            navigator.clipboard.writeText(FIXED_KEY);
            
            const btn = document.querySelector('.copy-btn');
            const oldText = btn.innerText;
            btn.innerText = "COPIED!";
            btn.style.background = "#00ff88";

            setTimeout(() => { 
                btn.innerText = oldText; 
                btn.style.background = "#bc13fe";
            }, 2000);
        }

        window.onload = typeLoop;
    </script>
</body>
</html>
